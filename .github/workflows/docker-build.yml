name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: ${{ secrets.ACR_NAMESPACE }}   # 阿里云命名空间，在 repo Secrets 中配置
  
jobs:
  # ── TensorRT image (NVIDIA GPU) ─────────────────────────────────────────────
  build-tensorrt:
    name: Build TensorRT image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin \
            ${{ env.REGISTRY }}

      - name: Extract metadata (TensorRT)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/inference-server-tensorrt
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push (TensorRT)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.tensorrt
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tensorrt
          cache-to: type=gha,mode=max,scope=tensorrt

  # ── Ascend image (华为 310P) ─────────────────────────────────────────────────
  build-ascend:
    name: Build Ascend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin \
            ${{ env.REGISTRY }}

      - name: Extract metadata (Ascend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/inference-server-ascend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push (Ascend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ascend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ascend
          cache-to: type=gha,mode=max,scope=ascend
