aipp_op {
  aipp_mode: static
  input_format: YUV420SP_U8       # 接受 DVPP 输出的 NV12 (YUV420SP)

  # ── DVPP 输出的原始分辨率 ──
  # 必须与 DVPP 解码输出（codec 分辨率）完全一致，否则 AIPP 内部内存越界 +
  # CANN 会报 "User input size is bigger than om size"，推理结果全是噪声。
  # 多分辨率摄像头需要分别编译多份 om，或改用 aipp_mode: dynamic。
  src_image_size_w: 1920
  src_image_size_h: 1080

  # ── 由 AIPP 硬件完成 1920×1080 → 640×640 缩放（取代 cv::resize/VPC 一步） ──
  crop: false
  resize: true
  resize_output_w: 640
  resize_output_h: 640

  # ── YUV → RGB 色域转换 + 归一化 ──
  csc_switch: true
  rbuv_swap_switch: true          # NV12 一般需要开（UV 交错）

  matrix_r0c0: 256
  matrix_r0c1: 0
  matrix_r0c2: 403
  matrix_r1c0: 256
  matrix_r1c1: -48
  matrix_r1c2: -120
  matrix_r2c0: 256
  matrix_r2c1: 475
  matrix_r2c2: 0

  input_bias_0: 0
  input_bias_1: 128
  input_bias_2: 128

  mean_chn_0: 0
  mean_chn_1: 0
  mean_chn_2: 0

  output_bias_0: 16
  output_bias_1: 128
  output_bias_2: 128

  padding: false

  # ── 归一化到 [0, 1]（pixel / 255）──
  var_reci_chn_0: 0.003921568627451
  var_reci_chn_1: 0.003921568627451
  var_reci_chn_2: 0.003921568627451
}
