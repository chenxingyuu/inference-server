basePath: /
definitions:
  infer-server.ArchiveAnalysisResponse:
    properties:
      backend:
        type: string
      batch_size:
        type: integer
      conf_thresh:
        type: number
      device_id:
        type: integer
      device_ids:
        items:
          type: integer
        type: array
      expires_at:
        type: string
      files_found:
        items:
          type: string
        type: array
      has_config:
        type: boolean
      input_size:
        items:
          type: integer
        type: array
      instance_count:
        type: integer
      model_type:
        type: string
      nms_thresh:
        type: number
      num_classes:
        type: integer
      suggested_id:
        type: string
      token:
        type: string
      yolo_version:
        type: string
    type: object
  infer-server.EdgeConfig:
    properties:
      capacity:
        type: integer
      drop_policy:
        enum:
        - block
        - drop_oldest
        - drop_newest
        type: string
      from:
        type: string
      to:
        type: string
    required:
    - from
    - to
    type: object
  infer-server.ErrorResponse:
    properties:
      code:
        example: in_use
        type: string
      message:
        example: 'source in use by a task: cam0'
        type: string
      status:
        example: error
        type: string
    type: object
  infer-server.InputShape:
    properties:
      c:
        example: 3
        type: integer
      h:
        example: 640
        type: integer
      w:
        example: 640
        type: integer
    type: object
  infer-server.ModelBox:
    properties:
      x1:
        type: number
      x2:
        type: number
      y1:
        type: number
      y2:
        type: number
    type: object
  infer-server.ModelCascadeRef:
    properties:
      attribute_key:
        type: string
      crop_expand:
        type: number
      model_id:
        type: string
      trigger_classes:
        items:
          type: integer
        type: array
    type: object
  infer-server.ModelDetail:
    properties:
      cascade_children:
        items:
          $ref: '#/definitions/infer-server.ModelCascadeRef'
        type: array
      cascade_parents:
        items:
          type: string
        type: array
      model:
        $ref: '#/definitions/infer-server.ModelInfo'
      pipelines:
        items:
          $ref: '#/definitions/infer-server.ModelPipelineRef'
        type: array
      registered:
        type: boolean
      repository:
        $ref: '#/definitions/infer-server.ModelDetailRepository'
      repository_error:
        type: boolean
    type: object
  infer-server.ModelDetailRepository:
    properties:
      version:
        type: string
      weight_paths:
        items:
          type: string
        type: array
    type: object
  infer-server.ModelInfo:
    properties:
      backend:
        type: string
      batch_size:
        type: integer
      class_names:
        items:
          type: string
        type: array
      conf_thresh:
        type: number
      device_id:
        type: integer
      id:
        type: string
      input_shape:
        example: 3x640x640
        type: string
      instance_count:
        type: integer
      max_queue_delay_us:
        type: integer
      model_type:
        enum:
        - detector
        - classifier
        type: string
      nms_thresh:
        type: number
      num_classes:
        type: integer
      preferred_batch_sizes:
        items:
          type: integer
        type: array
      version:
        type: string
    type: object
  infer-server.ModelLoad:
    properties:
      backend:
        enum:
        - cpu
        - trt
        - ascend
        type: string
      batch_size:
        type: integer
      class_names:
        items:
          type: string
        type: array
      conf_thresh:
        type: number
      device_id:
        type: integer
      engine_path:
        type: string
      id:
        type: string
      input_shape:
        $ref: '#/definitions/infer-server.InputShape'
      instance_count:
        type: integer
      max_queue_delay_us:
        type: integer
      model_type:
        enum:
        - detector
        - classifier
        type: string
      nms_thresh:
        type: number
      num_classes:
        type: integer
      om_paths:
        additionalProperties:
          type: string
        type: object
      onnx_path:
        type: string
      preferred_batch_sizes:
        items:
          type: integer
        type: array
      version:
        enum:
        - v5
        - v8
        - v11
        - v26
        type: string
    required:
    - id
    type: object
  infer-server.ModelPipelineRef:
    properties:
      cascade_nodes:
        items:
          type: string
        type: array
      id:
        type: string
      nodes:
        items:
          type: string
        type: array
      tasks:
        items:
          $ref: '#/definitions/infer-server.ModelPipelineTaskRef'
        type: array
    type: object
  infer-server.ModelPipelineTaskRef:
    properties:
      id:
        type: string
      state:
        enum:
        - stopped
        - starting
        - running
        - failed
        type: string
    type: object
  infer-server.ModelPrediction:
    properties:
      bbox:
        $ref: '#/definitions/infer-server.ModelBox'
      class_id:
        type: integer
      class_name:
        type: string
      confidence:
        type: number
    type: object
  infer-server.ModelTestResult:
    properties:
      backend:
        type: string
      conf_thresh:
        type: number
      height:
        type: integer
      model_type:
        type: string
      nms_thresh:
        type: number
      preview_jpeg:
        type: string
      results:
        items:
          $ref: '#/definitions/infer-server.ModelPrediction'
        type: array
      width:
        type: integer
    type: object
  infer-server.OkResponse:
    properties:
      id:
        example: cam0
        type: string
      status:
        example: ok
        type: string
    type: object
  infer-server.PipelineCreate:
    properties:
      edges:
        items:
          $ref: '#/definitions/infer-server.EdgeConfig'
        type: array
      id:
        type: string
      nodes:
        items:
          $ref: '#/definitions/infer-server.StageConfig'
        type: array
    required:
    - id
    - nodes
    type: object
  infer-server.PipelineEdgeInfo:
    properties:
      capacity:
        type: integer
      drop_policy:
        enum:
        - block
        - drop_oldest
        - drop_newest
        type: string
      from:
        type: string
      to:
        type: string
    type: object
  infer-server.PipelineInfo:
    properties:
      edges:
        items:
          $ref: '#/definitions/infer-server.PipelineEdgeInfo'
        type: array
      id:
        type: string
      nodes:
        items:
          $ref: '#/definitions/infer-server.PipelineNodeInfo'
        type: array
    type: object
  infer-server.PipelineNodeInfo:
    properties:
      id:
        type: string
      type:
        type: string
      with:
        additionalProperties:
          type: string
        type: object
    type: object
  infer-server.RepositoryModel:
    properties:
      backend:
        type: string
      batch_size:
        type: integer
      conf_thresh:
        type: number
      id:
        type: string
      instance_count:
        type: integer
      loaded:
        type: boolean
      model_type:
        type: string
      nms_thresh:
        type: number
      num_classes:
        type: integer
      version:
        type: string
    type: object
  infer-server.SourceAvailability:
    properties:
      basis:
        enum:
        - probe
        - none
        type: string
      observed_at_ms:
        type: integer
      reason:
        type: string
      status:
        enum:
        - online
        - offline
        - unchecked
        - unsupported
        type: string
    type: object
  infer-server.SourceCreate:
    properties:
      degraded_threshold:
        type: integer
      id:
        type: string
      max_reconnect_attempts:
        type: integer
      max_reconnect_delay_ms:
        type: integer
      open_timeout_ms:
        type: integer
      read_timeout_ms:
        type: integer
      reconnect_delay_ms:
        type: integer
      url:
        type: string
    required:
    - id
    - url
    type: object
  infer-server.SourceInfo:
    properties:
      availability:
        $ref: '#/definitions/infer-server.SourceAvailability'
      id:
        type: string
      last_probe:
        $ref: '#/definitions/infer-server.SourceProbeResult'
      reconnect_count:
        type: integer
      state:
        enum:
        - CONNECTING
        - STREAMING
        - RECONNECTING
        - DEGRADED
        - STOPPED
        - FAILED
        type: string
      url:
        type: string
    type: object
  infer-server.SourceProbeResponse:
    properties:
      availability:
        $ref: '#/definitions/infer-server.SourceAvailability'
      id:
        type: string
      last_probe:
        $ref: '#/definitions/infer-server.SourceProbeResult'
      reused_runtime:
        description: Always false for independent probes.
        type: boolean
    type: object
  infer-server.SourceProbeResult:
    properties:
      checked_at_ms:
        type: integer
      elapsed_ms:
        type: integer
      passed:
        type: boolean
      reason:
        type: string
    type: object
  infer-server.StageConfig:
    properties:
      id:
        type: string
      type:
        type: string
      with:
        additionalProperties:
          type: string
        type: object
    required:
    - id
    - type
    type: object
  infer-server.TaskCreate:
    properties:
      ascend_device_id:
        type: integer
      id:
        type: string
      pipeline_id:
        type: string
      sample_fps:
        type: number
      sampling_mode:
        enum:
        - frame_count
        - time_based
        type: string
      source_id:
        type: string
      use_ascend_dvpp:
        type: boolean
      use_hwdec:
        type: boolean
    required:
    - id
    - pipeline_id
    - source_id
    type: object
  infer-server.TaskFailure:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  infer-server.TaskInfo:
    properties:
      ascend_device_id:
        type: integer
      cleanup_pending:
        type: boolean
      failure:
        $ref: '#/definitions/infer-server.TaskFailure'
      id:
        type: string
      pipeline_id:
        type: string
      sample_fps:
        type: number
      sampling_mode:
        type: string
      source_id:
        type: string
      state:
        enum:
        - stopped
        - starting
        - running
        - failed
        type: string
      use_ascend_dvpp:
        type: boolean
      use_hwdec:
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    HTTP management API. All write operations are forwarded to the C++ engine via Unix domain socket.

    Protected endpoints require the header: Authorization: Bearer <INFER_API_KEY>
  title: infer-server Management API
  version: "1.0"
paths:
  /healthz:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "503":
          description: engine unreachable
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /metrics:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus text format
          schema:
            type: string
        "503":
          description: engine unreachable
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - health
  /models:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/infer-server.ModelInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List loaded models
      tags:
      - models
    post:
      consumes:
      - application/json
      parameters:
      - description: Model definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infer-server.ModelLoad'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Load a model
      tags:
      - models
  /models/{id}:
    delete:
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "409":
          description: model is in use by a pipeline or registered model
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Unload a model
      tags:
      - models
  /models/detail/{id}:
    get:
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.ModelDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Describe a model, its repository version, and references
      tags:
      - models
  /models/repository:
    get:
      description: Returns all models discoverable in the model_repository directory,
        with a `loaded` flag.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/infer-server.RepositoryModel'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List models in the repository
      tags:
      - models
  /models/repository/{id}/export:
    get:
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Download the active version of a repository model
      tags:
      - models
  /models/repository/{id}/load:
    post:
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Load a model from the repository by ID
      tags:
      - models
  /models/test/{id}:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      - description: One JPEG or PNG, at most 8 MiB and 4096 pixels per side
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.ModelTestResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Run single-image inference with a registered model
      tags:
      - models
  /models/upload:
    post:
      consumes:
      - multipart/form-data
      - application/x-www-form-urlencoded
      parameters:
      - description: Model ID (letters, numbers, _ and -)
        in: formData
        name: id
        required: true
        type: string
      - description: Token returned by upload/analyze
        in: formData
        name: token
        type: string
      - description: Backend for a direct upload
        in: formData
        name: backend
        type: string
      - description: ONNX weight for a direct upload
        in: formData
        name: onnx
        type: file
      - description: TensorRT weight for a direct upload
        in: formData
        name: engine
        type: file
      - description: Ascend Batch 1 weight for a direct upload
        in: formData
        name: batch_1
        type: file
      - description: Optional Ascend Batch 4 weight for a direct upload
        in: formData
        name: batch_4
        type: file
      - description: Optional Ascend Batch 8 weight for a direct upload
        in: formData
        name: batch_8
        type: file
      - description: Optional Ascend Batch 16 weight for a direct upload
        in: formData
        name: batch_16
        type: file
      - description: YOLO version
        in: formData
        name: yolo_version
        type: string
      - description: Model type
        in: formData
        name: model_type
        type: string
      - description: Model input height
        in: formData
        name: input_height
        type: integer
      - description: Model input width
        in: formData
        name: input_width
        type: integer
      - description: Batch size
        in: formData
        name: batch_size
        type: integer
      - description: Confidence threshold
        in: formData
        name: conf_thresh
        type: number
      - description: NMS threshold
        in: formData
        name: nms_thresh
        type: number
      - description: Number of classes
        in: formData
        name: num_classes
        type: integer
      - description: Worker instances
        in: formData
        name: instance_count
        type: integer
      - description: Default device ID
        in: formData
        name: device_id
        type: integer
      - description: Comma-separated device IDs
        in: formData
        name: device_ids
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: Engine unavailable or publication requires INFER_API_KEY
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Validate model weights and publish to the repository
      tags:
      - models
  /models/upload/analyze:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Model archive (.zip, .tar.gz or .tgz)
        in: formData
        name: archive
        type: file
      - description: Model weight (.onnx, .engine or .om)
        in: formData
        name: file
        type: file
      - description: Optional Ascend Batch 4 weight
        in: formData
        name: batch_4
        type: file
      - description: Optional Ascend Batch 8 weight
        in: formData
        name: batch_8
        type: file
      - description: Optional Ascend Batch 16 weight
        in: formData
        name: batch_16
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.ArchiveAnalysisResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: Model publication requires INFER_API_KEY
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Analyze uploaded weights or a single-model archive
      tags:
      - models
  /pipelines:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/infer-server.PipelineInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List pipelines
      tags:
      - pipelines
    post:
      consumes:
      - application/json
      parameters:
      - description: Pipeline definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infer-server.PipelineCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Add a pipeline
      tags:
      - pipelines
