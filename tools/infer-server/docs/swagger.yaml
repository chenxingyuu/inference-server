basePath: /
definitions:
  infer-server.EdgeConfig:
    properties:
      capacity:
        type: integer
      drop_policy:
        enum:
        - block
        - drop_oldest
        - drop_newest
        type: string
      from:
        type: string
      to:
        type: string
    required:
    - from
    - to
    type: object
  infer-server.ErrorResponse:
    properties:
      code:
        example: in_use
        type: string
      message:
        example: 'source in use by a task: cam0'
        type: string
      status:
        example: error
        type: string
    type: object
  infer-server.InputShape:
    properties:
      c:
        example: 3
        type: integer
      h:
        example: 640
        type: integer
      w:
        example: 640
        type: integer
    type: object
  infer-server.ModelInfo:
    properties:
      backend:
        type: string
      batch_size:
        type: integer
      class_names:
        items:
          type: string
        type: array
      conf_thresh:
        type: number
      device_id:
        type: integer
      id:
        type: string
      input_shape:
        example: 3x640x640
        type: string
      instance_count:
        type: integer
      max_queue_delay_us:
        type: integer
      model_type:
        enum:
        - detector
        - classifier
        type: string
      nms_thresh:
        type: number
      num_classes:
        type: integer
      preferred_batch_sizes:
        items:
          type: integer
        type: array
      version:
        type: string
    type: object
  infer-server.ModelLoad:
    properties:
      backend:
        enum:
        - cpu
        - trt
        - ascend
        type: string
      batch_size:
        type: integer
      class_names:
        items:
          type: string
        type: array
      conf_thresh:
        type: number
      device_id:
        type: integer
      engine_path:
        type: string
      id:
        type: string
      input_shape:
        $ref: '#/definitions/infer-server.InputShape'
      instance_count:
        type: integer
      max_queue_delay_us:
        type: integer
      model_type:
        enum:
        - detector
        - classifier
        type: string
      nms_thresh:
        type: number
      num_classes:
        type: integer
      onnx_path:
        type: string
      preferred_batch_sizes:
        items:
          type: integer
        type: array
      version:
        enum:
        - v5
        - v8
        - v11
        - v26
        type: string
    required:
    - id
    type: object
  infer-server.OkResponse:
    properties:
      id:
        example: cam0
        type: string
      status:
        example: ok
        type: string
    type: object
  infer-server.PipelineCreate:
    properties:
      edges:
        items:
          $ref: '#/definitions/infer-server.EdgeConfig'
        type: array
      id:
        type: string
      nodes:
        items:
          $ref: '#/definitions/infer-server.StageConfig'
        type: array
    required:
    - id
    - nodes
    type: object
  infer-server.PipelineEdgeInfo:
    properties:
      capacity:
        type: integer
      drop_policy:
        enum:
        - block
        - drop_oldest
        - drop_newest
        type: string
      from:
        type: string
      to:
        type: string
    type: object
  infer-server.PipelineInfo:
    properties:
      edges:
        items:
          $ref: '#/definitions/infer-server.PipelineEdgeInfo'
        type: array
      id:
        type: string
      nodes:
        items:
          $ref: '#/definitions/infer-server.PipelineNodeInfo'
        type: array
    type: object
  infer-server.PipelineNodeInfo:
    properties:
      id:
        type: string
      type:
        type: string
      with:
        additionalProperties:
          type: string
        type: object
    type: object
  infer-server.SourceCreate:
    properties:
      degraded_threshold:
        type: integer
      id:
        type: string
      max_reconnect_attempts:
        type: integer
      max_reconnect_delay_ms:
        type: integer
      open_timeout_ms:
        type: integer
      read_timeout_ms:
        type: integer
      reconnect_delay_ms:
        type: integer
      url:
        type: string
    required:
    - id
    - url
    type: object
  infer-server.SourceInfo:
    properties:
      id:
        type: string
      reconnect_count:
        type: integer
      state:
        enum:
        - CONNECTING
        - STREAMING
        - RECONNECTING
        - DEGRADED
        - STOPPED
        type: string
      url:
        type: string
    type: object
  infer-server.StageConfig:
    properties:
      id:
        type: string
      type:
        type: string
      with:
        additionalProperties:
          type: string
        type: object
    required:
    - id
    - type
    type: object
  infer-server.TaskCreate:
    properties:
      ascend_device_id:
        type: integer
      id:
        type: string
      pipeline_id:
        type: string
      sample_fps:
        type: number
      sampling_mode:
        enum:
        - frame_count
        - time_based
        type: string
      source_id:
        type: string
      use_ascend_dvpp:
        type: boolean
      use_hwdec:
        type: boolean
    required:
    - id
    - pipeline_id
    - source_id
    type: object
  infer-server.TaskInfo:
    properties:
      id:
        type: string
      state:
        enum:
        - running
        - stopped
        type: string
    type: object
info:
  contact: {}
  description: |-
    HTTP management API. All write operations are forwarded to the C++ engine via Unix domain socket.

    Protected endpoints require the header: Authorization: Bearer <INFER_API_KEY>
  title: infer-server Management API
  version: "1.0"
paths:
  /healthz:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "503":
          description: engine unreachable
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /metrics:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus text format
          schema:
            type: string
        "503":
          description: engine unreachable
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - health
  /models:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/infer-server.ModelInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List loaded models
      tags:
      - models
    post:
      consumes:
      - application/json
      parameters:
      - description: Model definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infer-server.ModelLoad'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Load a model
      tags:
      - models
  /models/{id}:
    delete:
      parameters:
      - description: Model ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "409":
          description: model is in use by a running task
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Unload a model
      tags:
      - models
  /pipelines:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/infer-server.PipelineInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List pipelines
      tags:
      - pipelines
    post:
      consumes:
      - application/json
      parameters:
      - description: Pipeline definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infer-server.PipelineCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Add a pipeline
      tags:
      - pipelines
  /pipelines/{id}:
    delete:
      parameters:
      - description: Pipeline ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "409":
          description: pipeline is in use by a task
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Remove a pipeline
      tags:
      - pipelines
  /sources:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/infer-server.SourceInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List sources
      tags:
      - sources
    post:
      consumes:
      - application/json
      parameters:
      - description: Source definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infer-server.SourceCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Add a source
      tags:
      - sources
  /sources/{id}:
    delete:
      parameters:
      - description: Source ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "409":
          description: source is in use by a task
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Remove a source
      tags:
      - sources
  /tasks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/infer-server.TaskInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Creates a task binding a source to a pipeline. Starts in stopped
        state; use POST /tasks/{id}/start to activate.
      parameters:
      - description: Task definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/infer-server.TaskCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Add a task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Remove a task
      tags:
      - tasks
  /tasks/{id}/{action}:
    post:
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Action
        enum:
        - start
        - stop
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/infer-server.OkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/infer-server.ErrorResponse'
        "503":
          description: engine unreachable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Start or stop a task
      tags:
      - tasks
securityDefinitions:
  ApiKeyAuth:
    description: Type "Bearer" followed by a space and your API key.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
