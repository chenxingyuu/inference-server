server:
  stream_pool_threads: 16
  max_streams: 50
  # Docker 部署时建议改为绝对路径，如 /var/run/infer/infer.sock
  socket_path: "./infer.sock"
  # CPU 软解线程数：0=自动，1=单线程（便于 profiling），>1=帧/片并行
  ffmpeg_decode_threads: 2
  # sink.stream 编码线程：0=ffmpeg 自动，1=单线程基线，>1=固定线程数
  ffmpeg_encode_threads: 0
  ffmpeg_log_level: "warning"
  log_level: "info"
  # 模型仓库根目录；每个含 config.yaml 的子目录注册为一个 model_id
  model_repository: "models"

# sources / pipelines / tasks 通过 API 管理，由 infer-server 持久化到 state.json 并在启动时重放。

# 推理结果发布：至少须有一个 enabled: true。
# Kafka 随主目标始终编译；gRPC/Redis 需 cmake 打开 BUILD_GRPC_PUBLISHER / BUILD_REDIS_PUBLISHER。
publishers:
  kafka:
    enabled: false
    brokers: "localhost:9092"
    topic: "inference-results"
    batch_size: 100
    linger_ms: 5
    compression: "lz4"
    queue_capacity: 10000
  grpc:
    enabled: true
    port: 50051
    max_connections: 100
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    stream_prefix: "inference"
    max_len: 1000
    queue_capacity: 10000

frame_archive:
  enabled: false
  local_dir: "./data/frames"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  # GPU/NPU 环境：allow_gpu_frames: true 可避免 GPU→CPU 拷贝
  # allow_gpu_frames: false
  # NPU 多路归档时可增大并发 worker 数
  # worker_count: 1
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: ""
    secret_key: ""
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2
