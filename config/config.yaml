server:
  stream_pool_threads: 32
  max_streams: 100
  management_port: 8080

models:
  # ── Primary detector with cascade to secondary classifiers ─────────────────
  - id: "yolov8n_trt"
    version: yolov8
    backend: tensorrt
    engine_path: "/models/yolov8n_b16.engine"
    input_size: [640, 640]
    batch_size: 16
    conf_thresh: 0.4
    nms_thresh: 0.45
    device_id: 0
    num_classes: 80
    instance_count: 1
    preferred_batch_sizes: [4, 8, 16]
    max_queue_delay_us: 10000
    # Cascade: trigger secondary classifiers for specific detection classes.
    # Secondary model configs must also be listed below but will be created
    # internally by the primary — do NOT add them to streams.model_id.
    cascade:
      - model_id: "cls_vehicle"
        trigger_classes: [2, 5, 7]   # car=2, bus=5, truck=7 (COCO ids)
        crop_expand: 0.05
        attribute_key: "vehicle_type"
      - model_id: "cls_person"
        trigger_classes: [0]          # person=0
        crop_expand: 0.10
        attribute_key: "person_attr"

  # ── Secondary classifier: vehicle type ────────────────────────────────────
  # Loaded internally by yolov8n_trt cascade; not assigned to any stream.
  - id: "cls_vehicle"
    version: yolov8          # version field is ignored for classifiers
    model_type: classifier
    backend: tensorrt
    engine_path: "/models/cls_vehicle.engine"
    input_size: [112, 112]
    batch_size: 32
    conf_thresh: 0.3
    device_id: 0
    num_classes: 5
    class_names: ["sedan", "suv", "bus", "truck", "other"]

  # ── Secondary classifier: person attributes ───────────────────────────────
  - id: "cls_person"
    version: yolov8
    model_type: classifier
    backend: tensorrt
    engine_path: "/models/cls_person.engine"
    input_size: [112, 112]
    batch_size: 32
    conf_thresh: 0.3
    device_id: 0
    num_classes: 4
    class_names: ["adult_male", "adult_female", "child", "unknown"]

  - id: "yolo11s_ascend"
    version: yolo11
    backend: ascend
    om_paths:
      1:  "/models/yolo11s_b1.om"
      4:  "/models/yolo11s_b4.om"
      8:  "/models/yolo11s_b8.om"
      16: "/models/yolo11s_b16.om"
    input_size: [640, 640]
    batch_size: 16
    conf_thresh: 0.4
    nms_thresh: 0.45
    device_id: 0
    num_classes: 80

streams:
  - id: "cam_001"
    url: "rtsp://192.168.1.100/stream1"
    model_id: "yolov8n_trt"
    sample_fps: 5
    reconnect_delay_ms: 3000
    use_hwdec: true
    tracker: "bytetrack"

  - id: "cam_002"
    url: "rtsp://192.168.1.101/stream1"
    model_id: "yolov8n_trt"
    sample_fps: 5
    reconnect_delay_ms: 3000
    use_hwdec: true
    tracker: "none"

kafka:
  brokers: "kafka:9092"
  topic: "inference-results"
  batch_size: 100
  linger_ms: 5
  compression: "lz4"
  queue_capacity: 10000

frame_archive:
  enabled: true
  local_dir: "/data/frames"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: "<CHANGE_ME_ACCESS_KEY>"
    secret_key: "<CHANGE_ME_SECRET_KEY>"
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2
