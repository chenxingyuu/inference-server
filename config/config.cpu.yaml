# CPU / ONNX Runtime 模板（需编译 BUILD_ONNX_BACKEND=ON，见 docker/Dockerfile.cpu）
#
# 使用方式：
#   本地：  ./build/infer_server config/config.cpu.yaml
#   Docker：默认入口为 /config/config.yaml，可二选一：
#     - 将本文件复制/软链为 config/config.yaml，或
#     - 覆盖启动参数，例如：docker run ... infer_server /config/config.cpu.yaml
#
# 将导出的 YOLO ONNX 放到 models/ 下，并按实际文件名修改 onnx_path。

server:
  stream_pool_threads: 16
  max_streams: 50
  socket_path: "./infer.sock"
  ffmpeg_log_level: "warning"
  log_level: "debug"
  # 仓库根：其下每个子目录若含 config.yaml 则注册为一个 model_id（如 models/yolov8n_cpu/）。
  model_repository: "models"

# sources / pipelines / tasks 通过 API 管理，由 infer-server 持久化到 state.json 并在启动时重放。

# 推理结果发布（buildPublisher）：至少须有一个 enabled: true。
# Kafka 随主目标始终编译；gRPC/Redis 需 cmake 打开 BUILD_GRPC_PUBLISHER / BUILD_REDIS_PUBLISHER。
# 管线里用 sink.publish 把 join 输出交给上述 IPublisher。
publishers:
  kafka:
    enabled: false
    brokers: "192.168.3.135:9092"
    topic: "inference-results"
    batch_size: 100
    linger_ms: 5
    compression: "lz4"
    queue_capacity: 10000
  grpc:
    enabled: true
    port: 50051
    max_connections: 100
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    stream_prefix: "inference"
    max_len: 1000
    queue_capacity: 10000

frame_archive:
  enabled: false
  local_dir: "./data/frames"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: ""
    secret_key: ""
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2
