# CPU / ONNX Runtime 模板（需编译 BUILD_ONNX_BACKEND=ON，见 docker/Dockerfile.cpu）
#
# 使用方式：
#   本地：  ./build/infer_server config/config.cpu.yaml
#   Docker：默认入口为 /config/config.yaml，可二选一：
#     - 将本文件复制/软链为 config/config.yaml，或
#     - 覆盖启动参数，例如：docker run ... infer_server /config/config.cpu.yaml
#
# 将导出的 YOLO ONNX 放到 models/ 下，并按实际文件名修改 onnx_path。

server:
  stream_pool_threads: 16
  max_streams: 50
  management_port: 8080
  ffmpeg_log_level: "fatal"
  # 仓库根：其下每个子目录若含 config.yaml 则注册为一个 model_id（如 models/yolov8n_cpu/）。
  model_repository: "models"

sources:
  - id: "cam_001"
    url: "rtsp://192.168.3.145:554/01-day-left.mp4"
    reconnect_delay_ms: 3000
    max_reconnect_delay_ms: 60000
    degraded_threshold: 5
    max_reconnect_attempts: 5

pipelines:
  - id: "pipeline_default"
    nodes:
      - id: "cam_001"
        type: "source.rtsp"
      - id: "decode_1"
        type: "decode.ffmpeg"
      - id: "infer_1"
        type: "infer.engine"
        with:
          model_id: "yolov8n_cpu"
      - id: "track_1"
        type: "track.bytetrack"
        with:
          high_det_thresh: "0.5"
          low_det_thresh: "0.1"
          match_iou_thresh: "0.3"
          min_hits_to_confirm: "2"
          max_lost_frames: "30"
      - id: "sink_ffplay"
        type: "sink.ffplay"
        with:
          fps: "5"
          queue_capacity: "16"
          draw_conf_thresh: "0.25"
          drop_policy: "drop_oldest"
    edges:
      - from: "cam_001"
        to: "decode_1"
      - from: "decode_1"
        to: "infer_1"
      - from: "infer_1"
        to: "track_1"
      - from: "track_1"
        to: "sink_ffplay"

tasks:
  - id: "task_cam_001"
    source_id: "cam_001"
    pipeline_id: "pipeline_default"
    sample_fps: 2
    sampling_mode: "time_based"
    use_hwdec: false

# 推理结果发布（buildPublisher）：至少须有一个 enabled: true。
# Kafka 随主目标始终编译；gRPC/Redis 需 cmake 打开 BUILD_GRPC_PUBLISHER / BUILD_REDIS_PUBLISHER。
# 管线里用 sink.publish 把 join 输出交给上述 IPublisher。
publishers:
  kafka:
    enabled: false
    brokers: "192.168.3.135:9092"
    topic: "inference-results"
    batch_size: 100
    linger_ms: 5
    compression: "lz4"
    queue_capacity: 10000
    heartbeat_topic: "inference-heartbeat"
    heartbeat_interval_ms: 5000
    control_topic: "inference-control"
  grpc:
    enabled: true
    port: 50051
    max_connections: 100
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    stream_prefix: "inference"
    max_len: 1000
    queue_capacity: 10000

frame_archive:
  enabled: false
  local_dir: "./data/frames"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: ""
    secret_key: ""
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2
