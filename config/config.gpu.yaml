# GPU / TensorRT 模板（需 NVIDIA 环境与 BUILD_TRT_BACKEND=ON，见 docker/Dockerfile.tensorrt）
#
# 使用方式：
#   本地：  ./build/infer_server config/config.gpu.yaml
#   Docker：默认可将本文件作为 /config/config.yaml 挂载，或传入对应路径。
#
# 将 TensorRT engine 放到 models/ 下，并按实际路径修改 engine_path。

server:
  stream_pool_threads: 16
  max_streams: 50
  socket_path: "/var/run/infer.sock"
  ffmpeg_log_level: "fatal"
  log_level: debug
  model_repository: "models"

sources:
  - id: "cam_001"
    url: "rtsp://192.168.3.145:554/01-day-left.mp4"
    reconnect_delay_ms: 3000
    max_reconnect_delay_ms: 60000
    degraded_threshold: 5
    max_reconnect_attempts: 5

pipelines:
  - id: "pipeline_default"
    nodes:
      - id: "cam_001"
        type: "source.rtsp"
      - id: "decode_1"
        type: "decode.ffmpeg"
      - id: "archive_1"
        type: "archive.raw"
      - id: "pre_1"
        type: "preprocess.yolo"
      - id: "infer_1"
        type: "infer.engine"
        with:
          model_id: "yolov8n_trt"
      - id: "post_1"
        type: "postprocess.yolo"
      - id: "track_1"
        type: "track.bytetrack"
        with:
          high_det_thresh: "0.5"
          low_det_thresh: "0.1"
          match_iou_thresh: "0.3"
          min_hits_to_confirm: "2"
          max_lost_frames: "30"
      - id: "join_1"
        type: "join.byFrameId"
      # 推理结果出口：写入根配置 publishers: 里启用的 IPublisher（本例 gRPC + Redis）。
      - id: "sink_1"
        type: "sink.publish"
    edges:
      - from: "cam_001"
        to: "decode_1"
      - from: "decode_1"
        to: "archive_1"
        queue:
          capacity: 2048
          drop_policy: "drop_oldest"
      - from: "decode_1"
        to: "pre_1"
        queue:
          capacity: 512
          drop_policy: "block"
      - from: "pre_1"
        to: "infer_1"
      - from: "infer_1"
        to: "post_1"
      - from: "post_1"
        to: "track_1"
      - from: "track_1"
        to: "join_1"
      - from: "archive_1"
        to: "join_1"
      - from: "join_1"
        to: "sink_1"

tasks:
  - id: "task_cam_001"
    source_id: "cam_001"
    pipeline_id: "pipeline_default"
    sample_fps: 1
    sampling_mode: "time_based"
    use_hwdec: true

# 推理结果发布（buildPublisher）：可同时启用多种通道；至少须有一个 enabled: true。
# 管线里用 sink.publish（或与 sink.publish 等价的 sink.kafka）把 join 输出交给上述 IPublisher。
# gRPC：客户端连 host:<grpc.port>，订阅 InferenceService::Subscribe。
# Redis：XADD 到流键 {stream_prefix}:{stream_id}，按需改 host/port。
publishers:
  kafka:
    enabled: false
    brokers: "192.168.3.135:9092"
    topic: "inference-results"
    batch_size: 100
    linger_ms: 5
    compression: "lz4"
    queue_capacity: 10000
    heartbeat_topic: "inference-heartbeat"
    heartbeat_interval_ms: 5000
    control_topic: "inference-control"
  grpc:
    enabled: true
    port: 50051
    max_connections: 100
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    stream_prefix: "inference"
    max_len: 1000
    queue_capacity: 10000

frame_archive:
  enabled: false
  local_dir: "./data/frames"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: "<CHANGE_ME_ACCESS_KEY>"
    secret_key: "<CHANGE_ME_SECRET_KEY>"
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2
