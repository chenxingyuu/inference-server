# GPU / TensorRT 模板（需 NVIDIA 环境与 BUILD_TRT_BACKEND=ON，见 docker/Dockerfile.tensorrt）
#
# 使用方式：
#   本地：  ./build/infer_server config/config.gpu.yaml
#   Docker：默认可将本文件作为 /config/config.yaml 挂载，或传入对应路径。
#
# 将 TensorRT engine 放到 models/ 下，并按实际路径修改 engine_path。

server:
  stream_pool_threads: 32
  max_streams: 100
  management_port: 8080

models:
  - id: "yolov8n_trt"
    version: yolov8
    backend: tensorrt
    engine_path: "/models/yolov8n_b16.engine"
    input_size: [640, 640]
    batch_size: 16
    conf_thresh: 0.4
    nms_thresh: 0.45
    device_id: 0
    num_classes: 80
    instance_count: 1
    preferred_batch_sizes: [4, 8, 16]
    max_queue_delay_us: 10000

sources:
  - id: "cam_001"
    url: "rtsp://192.168.3.145:554/01-day-left.mp4"
    reconnect_delay_ms: 3000
    max_reconnect_delay_ms: 60000
    degraded_threshold: 5
    max_reconnect_attempts: 5

pipelines:
  - id: "pipeline_default"
    nodes:
      - id: "cam_001"
        type: "source.rtsp"
      - id: "decode_1"
        type: "decode.ffmpeg"
      - id: "archive_1"
        type: "archive.raw"
      - id: "pre_1"
        type: "preprocess.yolo"
      - id: "infer_1"
        type: "infer.engine"
        with:
          model_id: "yolov8n_trt"
      - id: "post_1"
        type: "postprocess.yolo"
      - id: "track_1"
        type: "track.bytetrack"
      - id: "join_1"
        type: "join.byFrameId"
      - id: "sink_1"
        type: "sink.kafka"
    edges:
      - from: "cam_001"
        to: "decode_1"
      - from: "decode_1"
        to: "archive_1"
      - from: "decode_1"
        to: "pre_1"
      - from: "pre_1"
        to: "infer_1"
      - from: "infer_1"
        to: "post_1"
      - from: "post_1"
        to: "track_1"
      - from: "track_1"
        to: "join_1"
      - from: "archive_1"
        to: "join_1"
      - from: "join_1"
        to: "sink_1"

tasks:
  - id: "task_cam_001"
    source_id: "cam_001"
    pipeline_id: "pipeline_default"
    sample_fps: 5
    use_hwdec: true

kafka:
  brokers: "192.168.3.135:9092"
  topic: "inference-results"
  batch_size: 100
  linger_ms: 5
  compression: "lz4"
  queue_capacity: 10000
  heartbeat_topic: "inference-heartbeat"
  heartbeat_interval_ms: 5000
  control_topic: "inference-control"

frame_archive:
  enabled: true
  local_dir: "./data/frames"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: "<CHANGE_ME_ACCESS_KEY>"
    secret_key: "<CHANGE_ME_SECRET_KEY>"
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2
