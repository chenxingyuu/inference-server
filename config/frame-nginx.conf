server {
    listen 80;
    server_name _;

    # Static JPEG archive served from the shared infer-frames volume.
    # URL: GET /frames/{YYYYMMDD}/{HH}/{mm}/{stream_id}/{ts_ms}_{seq}.jpg
    location /frames/ {
        alias /data/frames/;
        autoindex off;

        location ~* \.jpg$ {
            add_header Cache-Control "public, max-age=86400, immutable";
        }
    }
}
