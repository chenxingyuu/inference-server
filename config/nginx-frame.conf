# Main nginx config for frame-nginx (trusted LAN; workers run as root).
user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Static JPEG archive served from the shared infer-frames volume.
        # URL: GET /frames/{YYYYMMDD}/{HH}/{mm}/{stream_id}/{ts_ms}_{seq}.jpg
        location /frames/ {
            alias /data/frames/;
            autoindex off;
            add_header Cache-Control "public, max-age=86400, immutable" always;
        }
    }
}
