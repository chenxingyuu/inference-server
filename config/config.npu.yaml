# NPU / 昇腾 CANN 模板（需 Ascend 设备与 BUILD_ASCEND_BACKEND=ON）
#
# 使用方式：
#   本地：  ./build/infer_server config/config.npu.yaml
#   Docker：见 docker/docker-compose.ascend.yml，可将本文件挂载为使用的配置路径。
#
# 使用 scripts/convert_ascend.sh 从 ONNX 导出多 batch 的 .om，并在 om_paths 中填写路径。

server:
  stream_pool_threads: 16
  max_streams: 50
  management_port: 8080
  ffmpeg_log_level: "fatal"
  log_level: "debug"
  model_repository: "models"

sources:
  - id: "cam_001"
    url: "rtsp://192.168.3.145:554/01-day-left.mp4"
    reconnect_delay_ms: 3000
    max_reconnect_delay_ms: 60000
    degraded_threshold: 5
    max_reconnect_attempts: 5

pipelines:
  - id: "pipeline_default"
    nodes:
      - id: "cam_001"
        type: "source.rtsp"
      - id: "archive_1"
        type: "archive.raw"
      - id: "infer_1"
        type: "infer.engine"
        with:
          model_id: "yolov5su_ascend"
      - id: "track_1"
        type: "track.bytetrack"
        with:
          high_det_thresh: "0.5"
          low_det_thresh: "0.1"
          match_iou_thresh: "0.3"
          min_hits_to_confirm: "2"
          max_lost_frames: "30"
      - id: "sink_1"
        type: "sink.publish"
    edges:
      - from: "cam_001"
        to: "archive_1"
      - from: "cam_001"
        to: "infer_1"
        queue:
          capacity: 4
          drop_policy: "drop_oldest"
      - from: "infer_1"
        to: "track_1"
      - from: "track_1"
        to: "sink_1"


tasks:
  - id: "task_cam_001"
    source_id: "cam_001"
    pipeline_id: "pipeline_default"
    sample_fps: 5
    sampling_mode: "time_based"
    use_hwdec: false
    use_ascend_dvpp: true

  
# 推理结果发布（buildPublisher）：与 CPU/GPU 模板一致；无 pipeline 的 streams 布局同样依赖此块。
# gRPC / Redis 需二进制打开 BUILD_GRPC_PUBLISHER / BUILD_REDIS_PUBLISHER（见 Makefile configure-*）。
publishers:
  kafka:
    enabled: false
    brokers: "192.168.3.135:9092"
    topic: "inference-results"
    batch_size: 100
    linger_ms: 5
    compression: "lz4"
    queue_capacity: 10000
    heartbeat_topic: "inference-heartbeat"
    heartbeat_interval_ms: 5000
    control_topic: "inference-control"
  grpc:
    enabled: true
    port: 50051
    max_connections: 100
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    stream_prefix: "inference"
    max_len: 1000
    queue_capacity: 10000

frame_archive:
  enabled: false
  allow_gpu_frames: true
  worker_count: 2
  local_dir: "/data"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: "<CHANGE_ME_ACCESS_KEY>"
    secret_key: "<CHANGE_ME_SECRET_KEY>"
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2