# NPU / 昇腾 CANN 模板（需 Ascend 设备与 BUILD_ASCEND_BACKEND=ON）
#
# 使用方式：
#   本地：  ./build/infer_server config/config.npu.yaml
#   Docker：见 docker/docker-compose.ascend.yml，可将本文件挂载为使用的配置路径。
#
# 使用 scripts/convert_ascend.sh 从 ONNX 导出多 batch 的 .om，并在 om_paths 中填写路径。

server:
  stream_pool_threads: 32
  max_streams: 100
  management_port: 8080

models:
  - id: "yolo11s_ascend"
    version: yolo11
    backend: ascend
    om_paths:
      1:  "/models/yolo11s_b1.om"
      4:  "/models/yolo11s_b4.om"
      8:  "/models/yolo11s_b8.om"
      16: "/models/yolo11s_b16.om"
    input_size: [640, 640]
    batch_size: 16
    conf_thresh: 0.4
    nms_thresh: 0.45
    device_id: 0
    num_classes: 80
    instance_count: 1
    preferred_batch_sizes: [1, 4, 8, 16]
    max_queue_delay_us: 10000

streams:
  - id: "cam_001"
    url: "rtsp://192.168.3.145:554/01-day-left.mp4"
    model_id: "yolo11s_ascend"
    sample_fps: 5
    reconnect_delay_ms: 3000
    max_reconnect_delay_ms: 60000
    max_reconnect_attempts: 5
    use_hwdec: false
    tracker: "none"

# 推理结果发布（buildPublisher）：与 CPU/GPU 模板一致；无 pipeline 的 streams 布局同样依赖此块。
# gRPC / Redis 需二进制打开 BUILD_GRPC_PUBLISHER / BUILD_REDIS_PUBLISHER（见 Makefile configure-*）。
publishers:
  kafka:
    enabled: false
    brokers: "192.168.3.135:9092"
    topic: "inference-results"
    batch_size: 100
    linger_ms: 5
    compression: "lz4"
    queue_capacity: 10000
    heartbeat_topic: "inference-heartbeat"
    heartbeat_interval_ms: 5000
    control_topic: "inference-control"
  grpc:
    enabled: true
    port: 50051
    max_connections: 100
  redis:
    enabled: true
    host: "127.0.0.1"
    port: 6379
    stream_prefix: "inference"
    max_len: 1000
    queue_capacity: 10000

frame_archive:
  enabled: false
  local_dir: "./data/frames"
  save_interval: 1
  jpeg_quality: 90
  queue_capacity: 4096
  minio:
    enabled: false
    endpoint: "minio:9000"
    bucket: "inference-frames"
    access_key: ""
    secret_key: ""
    region: "us-east-1"
    use_ssl: false
    connect_timeout_ms: 1500
    request_timeout_ms: 3000
    max_retries: 2
