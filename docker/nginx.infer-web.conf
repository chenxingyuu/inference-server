server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Go management server.
    # Use /api prefix to avoid clashing with SPA routes like /models on browser refresh.
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://infer-server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_pass_request_headers         on;
        # Disable buffering for streaming responses (e.g. metrics)
        proxy_buffering off;
    }
}
