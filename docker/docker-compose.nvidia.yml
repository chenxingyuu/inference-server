services:
  # ── Inference service (TensorRT) ───────────────────────────────────────────
  infer-trt:
    image: registry.cn-hangzhou.aliyuncs.com/daxx/inference-server:tensorrt
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    gpus: all
    volumes:
      - ../models:/models:ro
      - ../config:/config:ro
      - infer-socket:/var/run/infer
      - infer-frames:/data/frames
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ── Frame archive static file server (nginx) ───────────────────────────────
  frame-nginx:
    image: nginx:1.27-alpine
    user: "0:0"
    ports:
      - "8082:80"
    volumes:
      - infer-frames:/data/frames:ro
      - ../config/nginx-frame.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - infer-trt
    restart: unless-stopped

  # ── Management HTTP sidecar (Go) ───────────────────────────────────────────
  infer-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.infer-server
    ports:
      - "8080:8080"
    environment:
      - INFER_SOCKET=/var/run/infer/infer.sock
      - INFER_STATE_FILE=/var/lib/infer-server/state.json
    volumes:
      - infer-socket:/var/run/infer:ro
      - infer-state:/var/lib/infer-server
    depends_on:
      - infer-trt
    restart: unless-stopped

  # ── Web UI ────────────────────────────────────────────────────────────────
  infer-web:
    image: registry.cn-hangzhou.aliyuncs.com/daxx/infer-web:latest
    ports:
      - "8081:80"
    depends_on:
      - infer-server
    restart: unless-stopped

volumes:
  infer-socket:
  infer-state:
  infer-frames:
