version: "3.9"

# CPU-only stack — no GPU required.
# Use this for development, CI, and machines without NVIDIA or Ascend hardware.
#
# Usage:
#   docker compose -f docker/docker-compose.cpu.yml up --build
#
# Place your ONNX model under ./models/ and mount ./config/config.yaml.

services:
  # ── Inference service (ONNX Runtime / CPU) ────────────────────────────────
  infer-cpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    volumes:
      - ../models:/models:ro
      - ../config:/config:ro
      - infer-socket:/var/run/infer
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # ── Management HTTP sidecar (Go) ───────────────────────────────────────────
  infer-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.infer-server
    ports:
      - "8080:8080"
    environment:
      - INFER_SOCKET=/var/run/infer/infer.sock
      - INFER_STATE_FILE=/var/lib/infer-server/state.json
    volumes:
      - infer-socket:/var/run/infer:ro
      - infer-state:/var/lib/infer-server
    depends_on:
      - infer-cpu
    restart: unless-stopped

  # ── Web UI ────────────────────────────────────────────────────────────────
  infer-web:
    image: registry.cn-hangzhou.aliyuncs.com/daxx/infer-web:latest
    ports:
      - "8081:80"
    depends_on:
      - infer-server
    restart: unless-stopped

  # ── ZooKeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    restart: unless-stopped

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - infer-server
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  prometheus-data:
  grafana-data:
  infer-socket:
  infer-state:
