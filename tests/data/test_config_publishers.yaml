server:
  stream_pool_threads: 4
  max_streams: 10

sources:
  - id: cam_01
    url: rtsp://localhost/cam1

models:
  - id: m1
    version: yolov8
    backend: tensorrt
    input_size: [640, 640]

pipelines:
  - id: p1
    nodes:
      - id: cam_01
        type: source.rtsp
      - id: sink_1
        type: sink.kafka
    edges:
      - from: cam_01
        to: sink_1

tasks:
  - id: t1
    source_id: cam_01
    pipeline_id: p1

publishers:
  kafka:
    enabled: true
    brokers: "broker:9093"
    topic: "pub-results"
    batch_size: 200
    linger_ms: 15
    compression: "gzip"
    queue_capacity: 5000
  grpc:
    enabled: true
    port: 50052
    max_connections: 50
  redis:
    enabled: true
    host: "redis-host"
    port: 6380
    stream_prefix: "infer"
    max_len: 500
    queue_capacity: 2000
