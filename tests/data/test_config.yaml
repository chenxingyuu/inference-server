server:
  stream_pool_threads: 4
  max_streams: 10
  management_port: 9090

models:
  - id: yolo_det
    version: yolov5
    backend: tensorrt
    engine_path: /models/yolo.trt
    batch_size: 8
    conf_thresh: 0.5
    nms_thresh: 0.4
    device_id: 0
    num_classes: 3
    input_size: [640, 640]
    class_names: [car, truck, bus]
    cascade:
      - model_id: classifier_01
        trigger_classes: [0, 1]
        crop_expand: 0.1
        attribute_key: vehicle_type

  - id: classifier_01
    version: yolov8
    backend: tensorrt
    model_type: classifier
    engine_path: /models/cls.trt
    batch_size: 4
    conf_thresh: 0.3
    num_classes: 5
    input_size: [224, 224]
    class_names: [sedan, suv, truck, bus, van]

streams:
  - id: cam_01
    url: rtsp://localhost/cam1
    model_id: yolo_det
    sample_fps: 10
    reconnect_delay_ms: 1000
    use_hwdec: false
    tracker: bytetrack

  - id: cam_02
    url: rtsp://localhost/cam2
    model_id: yolo_det
    sample_fps: 5
    reconnect_delay_ms: 2000
    use_hwdec: true
    tracker: none

kafka:
  brokers: localhost:9092
  topic: test-results
  batch_size: 50
  linger_ms: 10
  compression: lz4
  queue_capacity: 5000

frame_archive:
  enabled: true
  local_dir: /tmp/infer-frames
  save_interval: 2
  jpeg_quality: 85
  queue_capacity: 128
  minio:
    enabled: true
    endpoint: minio.local:9000
    bucket: infer-frames
    access_key: test_access
    secret_key: test_secret
    region: us-east-1
    use_ssl: false
    connect_timeout_ms: 1200
    request_timeout_ms: 2800
    max_retries: 3
