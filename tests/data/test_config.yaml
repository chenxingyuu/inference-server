server:
  stream_pool_threads: 4
  max_streams: 10
  socket_path: "/var/run/infer.sock"
  ffmpeg_log_level: fatal
  ffmpeg_decode_threads: 4
  log_level: debug

models:
  - id: yolo_det
    version: yolov5
    backend: tensorrt
    engine_path: /models/yolo.trt
    batch_size: 8
    conf_thresh: 0.5
    nms_thresh: 0.4
    device_id: 0
    num_classes: 3
    input_size: [640, 640]
    class_names: [car, truck, bus]
    cascade:
      - model_id: classifier_01
        trigger_classes: [0, 1]
        crop_expand: 0.1
        attribute_key: vehicle_type

  - id: classifier_01
    version: yolov8
    backend: tensorrt
    model_type: classifier
    engine_path: /models/cls.trt
    batch_size: 4
    conf_thresh: 0.3
    num_classes: 5
    input_size: [224, 224]
    class_names: [sedan, suv, truck, bus, van]

sources:
  - id: cam_01
    url: rtsp://localhost/cam1
    reconnect_delay_ms: 1000
  - id: cam_02
    url: rtsp://localhost/cam2
    reconnect_delay_ms: 2000

pipelines:
  - id: pipe_01
    nodes:
      - id: cam_01
        type: source.rtsp
      - id: archive_1
        type: archive.raw
      - id: infer_1
        type: infer.engine
        with:
          model_id: yolo_det
      - id: track_1
        type: track.bytetrack
      - id: join_1
        type: join.byFrameId
      - id: sink_1
        type: sink.kafka
    edges:
      - from: cam_01
        to: archive_1
        queue:
          capacity: 128
          drop_policy: drop_oldest
      - from: cam_01
        to: infer_1
      - from: infer_1
        to: track_1
      - from: track_1
        to: join_1
      - from: archive_1
        to: join_1
      - from: join_1
        to: sink_1

tasks:
  - id: task_pipe_01
    source_id: cam_01
    pipeline_id: pipe_01
    sample_fps: 10
    use_hwdec: false
    use_ascend_dvpp: true
    ascend_device_id: 2

publishers:
  - id: kafka_main
    type: kafka
    brokers: localhost:9092
    topic: test-results
    batch_size: 50
    linger_ms: 10
    compression: lz4
    queue_capacity: 5000

frame_archive:
  enabled: true
  allow_gpu_frames: false
  worker_count: 3
  local_dir: /tmp/infer-frames
  save_interval: 2
  jpeg_quality: 85
  queue_capacity: 128
